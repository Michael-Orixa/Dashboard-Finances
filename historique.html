<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historique P&L — Orixa Groupe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0f1117; --surface:#1a1d27; --surface2:#222636; --border:rgba(255,255,255,0.08); --text:#e8eaf0; --muted:#6b7280; --accent:#6366f1; --green:#10b981; --red:#ef4444; --orixa:#6366f1; --feedcast:#22d3ee; --visiperf:#f59e0b; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:"DM Sans",sans-serif; min-height:100vh; display:flex; }
  .sidebar { width:200px; min-width:200px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; position:fixed; top:0; left:0; height:100vh; z-index:10; }
    .sidebar-logo { height:62px; flex:0 0 auto; display:flex; align-items:center; padding:0 1.2rem; border-bottom:1px solid var(--border); }
  .sidebar-nav { display:flex; flex-direction:column; gap:4px; padding:1rem 0.8rem; flex:1; }
  .nav-btn { padding:8px 12px; border-radius:8px; border:1px solid transparent; background:transparent; color:var(--muted); font-size:12px; font-family:"DM Sans",sans-serif; cursor:pointer; font-weight:500; text-align:left; width:100%; display:flex; align-items:center; gap:8px; text-decoration:none; transition:all 0.15s; }
  .nav-btn svg { width:16px; height:16px; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; opacity:0.85; }
  .nav-btn.active svg { opacity:1; }
  .nav-btn:hover { color:var(--text); background:var(--surface2); }
  .nav-btn.active { border-color:rgba(99,102,241,0.3); color:white; background:rgba(99,102,241,0.15); }
  .sidebar-footer { padding:1rem 0.8rem; border-top:1px solid var(--border); }
  .user-info { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .user-name { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .user-avatar { width:26px; height:26px; border-radius:50%; border:1px solid var(--border); flex-shrink:0; }
  .btn-logout { padding:5px 10px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:11px; cursor:pointer; width:100%; text-align:center; }
  .btn-logout:hover { border-color:var(--red); color:var(--red); }
  .main-content { margin-left:200px; flex:1; min-width:0; }
  .filters { min-height:62px; padding:9px 2rem; display:flex; gap:8px; align-items:center; border-bottom:1px solid var(--border); flex-wrap:nowrap; overflow-x:auto; }
  .filter-label { font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); }
  .filter-btn { padding:4px 12px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:12px; font-family:"DM Sans",sans-serif; cursor:pointer; transition:all 0.15s; }
  .filter-btn:hover, .filter-btn.active { border-color:var(--accent); color:white; background:var(--accent); }
  .filter-btn.vp.active { background:var(--visiperf); border-color:var(--visiperf); color:#0f1117; }
  .sep { width:1px; height:16px; background:var(--border); align-self:center; }
  .page-body { padding:1.5rem 2rem; }
  .charts-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:12px; min-width:0; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:1.2rem; min-width:0; overflow:hidden; }
  .card-title { font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text); margin-bottom:1rem; font-weight:500; }
  .chart-wrap { position:relative; height:220px; min-width:0; }
  .table-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:1.2rem; }
  .card-title-main { font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text); margin-bottom:1rem; font-weight:500; }
  .pl-wrap { overflow-x:auto; }
  .pl-table { width:100%; border-collapse:collapse; font-family:"DM Sans",sans-serif; font-variant-numeric:tabular-nums; font-size:12px; min-width:900px; }
  .pl-table th { background:var(--surface2); color:var(--text); font-size:13px; font-weight:600; padding:10px 16px; text-align:right; border-bottom:2px solid var(--accent); white-space:nowrap; }
  .pl-table th:first-child { text-align:left; min-width:280px; }
  .pl-table td { padding:6px 12px; text-align:right; border-bottom:1px solid rgba(255,255,255,0.03); white-space:nowrap; }
  .pl-table td:first-child { text-align:left; font-family:"DM Sans",sans-serif; font-size:12px; color:var(--muted); padding-left:20px; }
  .pl-table tr.solde td { font-weight:700; color:var(--text); border-top:1px solid var(--border); border-bottom:1px solid var(--border); background:rgba(255,255,255,0.03); }
  .pl-table tr.solde td:first-child { font-family:"DM Sans",sans-serif; text-transform:uppercase; font-size:11px; letter-spacing:0.04em; padding-left:12px; }
  .pl-table tr:hover td { background:rgba(255,255,255,0.02); }
  .pl-table tr.solde:hover td { background:rgba(255,255,255,0.05); }
  .val-neg { color:var(--red); }
  .val-pos { color:var(--text); }
  .val-zero { color:var(--muted); }
  .val-muted { color:var(--muted); }
  .overlay { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; z-index:100; }
  .spinner { width:24px; height:24px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .spin-txt { font-size:12px; color:var(--muted); font-family:"DM Sans",sans-serif; }
</style>
</head>
<body>

<div id="loadingOverlay" class="overlay">
  <div class="spinner"></div>
  <div class="spin-txt" id="loadingTxt">Chargement...</div>
</div>

    <div class="sidebar">
      <div class="sidebar-logo">
                <img src="logo.png" alt="Orixa Groupe" style="height:32px;width:auto;opacity:0.95">
      </div>
      <nav class="sidebar-nav">
               <a class="nav-btn" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg> Activité</a>
        <a class="nav-btn active" href="historique.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg> Historique P&L</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <img id="uAvatar" class="user-avatar" src="" alt="">
          <span id="uName" class="user-name"></span>
        </div>
        <button class="btn-logout" onclick="logout()">Déconnexion</button>
      </div>
    </div>

<div class="main-content">
  <div class="filters" id="filters-historique">
    <span class="filter-label">Périmètre</span>
    <button class="filter-btn h-ent active" onclick="setHF('all',this)">Groupe</button>
    <button class="filter-btn h-ent" onclick="setHF('Orixa',this)">Orixa</button>
    <button class="filter-btn h-ent" onclick="setHF('Orixa Media',this)">Orixa Media</button>
    <button class="filter-btn h-ent vp" onclick="setHF('Visiperf',this)">Visiperf</button>
    <div class="sep"></div>
    <span class="filter-label">Années</span>
    <button class="filter-btn h-year active" onclick="setHA('all',this)">Toutes</button>
    <button class="filter-btn h-year" onclick="setHA('2025',this)">2025</button>
    <button class="filter-btn h-year" onclick="setHA('2024',this)">2024</button>
    <button class="filter-btn h-year" onclick="setHA('2023',this)">2023</button>
    <button class="filter-btn h-year" onclick="setHA('2022',this)">2022</button>
    <button class="filter-btn h-year" onclick="setHA('2021',this)">2021</button>
    <button class="filter-btn h-year" onclick="setHA('2020',this)">2020</button>
    <button class="filter-btn h-year" onclick="setHA('2019',this)">2019</button>
    <button class="filter-btn h-year" onclick="setHA('2018',this)">2018</button>
    <button class="filter-btn h-year" onclick="setHA('2017',this)">2017</button>
    <button class="filter-btn h-year" onclick="setHA('2016',this)">2016</button>
    <button class="filter-btn h-year" onclick="setHA('2015',this)">2015</button>
  </div>
  <div class="page-body">
    <div class="charts-row">
      <div class="card">
        <div class="card-title">Marge Brute — Evolution</div>
        <div class="chart-wrap"><canvas id="cHistMB"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">EBITDA — Evolution</div>
        <div class="chart-wrap"><canvas id="cHistEBITDA"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Résultat Net — Evolution</div>
        <div class="chart-wrap"><canvas id="cHistRN"></canvas></div>
      </div>
    </div>
    <div class="table-card">
      <div class="card-title-main" id="pl-title">P&L Historique</div>
      <div class="pl-wrap">
        <table class="pl-table">
          <thead><tr id="pl-head"></tr></thead>
          <tbody id="pl-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const CLIENT_ID = '510789614747-6n2tkok24lah8u59ma2f33kko6mhmbe7.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/bigquery.readonly https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/spreadsheets.readonly';
const TOKEN_TTL = 3500 * 1000;
const PROJECT = 'db-finances-496809';

function loadToken() {
  let tok, ts;
  try { tok=localStorage.getItem('bq_token'); ts=parseInt(localStorage.getItem('bq_token_ts')||'0'); } catch(e) {}
  return (tok && (Date.now()-ts)<TOKEN_TTL) ? tok : null;
}
function clearToken() {
  try { localStorage.removeItem('bq_token'); localStorage.removeItem('bq_token_ts'); } catch(e) {}
}
function logout() { clearToken(); window.location.href='index.html'; }
function fmtRaw(v) {
  v=Number(v); const abs=Math.abs(v);
  if(abs>=1000000) return (v/1000000).toFixed(1)+' M€';
  if(abs>=1000) return Math.round(v/1000)+' K€';
  return Math.round(v)+' €';
}
function fmt(v) {
  v=Number(v);
  if(isNaN(v)||v===0) return '<span class="val-zero">—</span>';
  return '<span class="'+(v<0?'val-neg':'val-pos')+'">'+fmtRaw(v)+'</span>';
}
function fmtNeutral(v) {
  v=Number(v);
  if(isNaN(v)||v===0) return '<span class="val-zero">—</span>';
  if(v<0) return '<span class="val-neg">'+fmtRaw(v)+'</span>';
  return '<span class="val-muted">'+fmtRaw(v)+'</span>';
}
async function bqQuery(token, sql) {
  const r=await fetch('https://bigquery.googleapis.com/bigquery/v2/projects/'+PROJECT+'/queries',{
    method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify({query:sql,useLegacySql:false,timeoutMs:20000})
  });
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error('BQ '+r.status+': '+(e.error?.message||r.statusText));}
  const d=await r.json();
  if(d.error) throw new Error(d.error.message);
  if(!d.rows) return [];
  const fields=d.schema.fields.map(f=>f.name);
  return d.rows.map(row=>{const o={};row.f.forEach((c,i)=>o[fields[i]]=c.v);return o;});
}

let token=null, histData=[], hF=new Set(), hA=new Set(), cHistMB, cHistEBITDA, cHistRN;

const HIST_COLORS = {
  'Orixa':       {bg:'rgba(99,102,241,0.7)',b:'#6366f1'},
  'Orixa Media': {bg:'rgba(34,211,238,0.7)',b:'#22d3ee'},
  'Visiperf':    {bg:'rgba(245,158,11,0.7)',b:'#f59e0b'},
  'Groupe':      {bg:'rgba(16,185,129,0.7)',b:'#10b981'}
};

const PL_ROWS = [
  {label:'CA',field:'ca',solde:false, neutral:true},
  {label:'MB',field:'mb',solde:true},
  {label:'Autres achats et charges externes',field:'ace',solde:false},
  {label:'Fees Direction',field:'fees_direction',solde:false},
  {label:'VALEUR AJOUTEE',field:'valeur_ajoutee',solde:true},
  {label:'Production immobilisee',field:'production_immobilisee',solde:false},
  {label:"Subventions d'exploitation",field:'subventions_exploitation',solde:false},
  {label:'Masse salariale',field:'masse_salariale',solde:false},
  {label:'EBITDA',field:'ebitda',solde:true},
  {label:'Impots et taxes',field:'impots_taxes',solde:false},
  {label:'Reprises sur amort.',field:'reprises_amst',solde:false},
  {label:'Autres produits de gestion',field:'autres_produits',solde:false},
  {label:'Dotations aux amortissements',field:'dotations_amst',solde:false},
  {label:'Dotations aux provisions',field:'dotations_provisions',solde:false},
  {label:'Autres charges de gestion',field:'autres_charges',solde:false},
  {label:'EBIT',field:'ebit',solde:true},
  {label:'Produits financiers',field:'produits_financiers',solde:false},
  {label:'Charges financieres',field:'charges_financieres',solde:false},
  {label:'RESULTAT COURANT AVANT IMPOTS',field:'rcai',solde:true},
  {label:'Produits exceptionnels',field:'produits_exceptionnels',solde:false},
  {label:'Charges exceptionnelles',field:'charges_exceptionnelles',solde:false},
  {label:'RESULTAT EXCEPTIONNEL',field:'resultat_exceptionnel',solde:true},
  {label:'RESULTAT NET COMPTABLE',field:'resultat_net_comptable',solde:true},
  {label:'Impot sur les benefices',field:'impots_societe',solde:false},
  {label:'CII',field:'credit_impots',solde:false},
  {label:'RESULTAT NET',field:'resultat_net',solde:true}
];

function setHF(val,btn) {
  const allBtn=document.querySelector('.h-ent[onclick*="all"]');
  if(val==='all'){hF=new Set();document.querySelectorAll('.h-ent').forEach(b=>b.classList.remove('active'));allBtn.classList.add('active');}
  else{hF.has(val)?hF.delete(val):hF.add(val);hF.size>0?allBtn.classList.remove('active'):(hF=new Set(),allBtn.classList.add('active'));btn.classList.toggle('active',hF.has(val));}
  document.getElementById('pl-title').textContent='P&L Historique — '+(hF.size===0?'Groupe consolide':[...hF].join(' + '));
  renderPL();
}

function setHA(val,btn) {
  const allBtn=document.querySelector('.h-year[onclick*="all"]');
  if(val==='all'){hA=new Set();document.querySelectorAll('.h-year').forEach(b=>b.classList.remove('active'));allBtn.classList.add('active');}
  else{hA.has(val)?hA.delete(val):hA.add(val);hA.size>0?allBtn.classList.remove('active'):(hA=new Set(),allBtn.classList.add('active'));btn.classList.toggle('active',hA.has(val));}
  renderPL();
}

function renderPL() {
  let data=histData;
  if(hF.size>0) data=data.filter(r=>hF.has(r.entite));
  if(hA.size>0) data=data.filter(r=>hA.has(String(r.annee)));

  const FIELDS=['ca','mb','ace','fees_direction','production_immobilisee','subventions_exploitation','masse_salariale','impots_taxes','reprises_amst','autres_produits','dotations_amst','dotations_provisions','autres_charges','produits_financiers','charges_financieres','produits_exceptionnels','charges_exceptionnelles','impots_societe','credit_impots','valeur_ajoutee','ebitda','ebit','rcai','resultat_exceptionnel','resultat_net_comptable','resultat_net'];
  const anneesMap={};
  data.forEach(r=>{
    const a=String(r.annee);
    if(!anneesMap[a]) anneesMap[a]={};
    FIELDS.forEach(f=>{anneesMap[a][f]=(anneesMap[a][f]||0)+Number(r[f]||0);});
  });

  const annees=Object.keys(anneesMap).sort((a,b)=>b-a);
  const anneesChron=Object.keys(anneesMap).sort((a,b)=>a-b);

  document.getElementById('pl-head').innerHTML='<th></th>'+annees.map(a=>'<th>'+a+'</th>').join('');
  document.getElementById('pl-body').innerHTML=PL_ROWS.map(row=>
    '<tr class="'+(row.solde?'solde':'')+'"><td>'+row.label+'</td>'+annees.map(a=>'<td>'+(row.solde?fmt(anneesMap[a][row.field]||0):fmtNeutral(anneesMap[a][row.field]||0))+'</td>').join('')+'</tr>'
  ).join('');

  // Graphiques
  const isConsolidated=hF.size===0;
  const entities=isConsolidated?['Groupe']:[...hF];

  // Toujours une seule courbe consolidee (somme des entites selectionnees)
  function buildDatasets(field) {
    const label = isConsolidated ? 'Groupe' : [...hF].join(' + ');
    const col = HIST_COLORS['Groupe'];
    const data = anneesChron.map(a => anneesMap[a]?.[field] || 0);
    return [{label, data, borderColor:col.b, backgroundColor:col.bg, borderWidth:2, pointRadius:4, tension:0.3}];
  }

  const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#6b7280',font:{family:'DM Sans',size:11}}},y:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#6b7280',font:{family:'DM Sans',size:11},callback:v=>fmtRaw(v)}}}};

  if(cHistMB) cHistMB.destroy();
  cHistMB=new Chart(document.getElementById('cHistMB'),{type:'line',data:{labels:anneesChron,datasets:buildDatasets('mb').map(d=>({...d,fill:entities.length===1,backgroundColor:d.backgroundColor.replace('0.7','0.15')}))},options:opts});

  if(cHistEBITDA) cHistEBITDA.destroy();
  cHistEBITDA=new Chart(document.getElementById('cHistEBITDA'),{type:'line',data:{labels:anneesChron,datasets:buildDatasets('ebitda').map(d=>({...d,fill:entities.length===1,backgroundColor:d.backgroundColor.replace('0.7','0.15')}))},options:opts});

  if(cHistRN) cHistRN.destroy();
  cHistRN=new Chart(document.getElementById('cHistRN'),{type:'line',data:{labels:anneesChron,datasets:buildDatasets('resultat_net').map(d=>({...d,fill:entities.length===1,backgroundColor:d.backgroundColor.replace('0.7','0.15')}))},options:opts});
}

async function init() {
  const tok=loadToken();
  if(!tok){window.location.href='index.html';return;}
  token=tok;
  try {
    const u=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tok}}).then(r=>r.json());
    if(u.error) throw new Error(u.error.message);
    // Controle d'acces
    const EMAILS_AUTORISES = ['michael@orixamedia.com','kugen.vissouvanadin@orixamedia.com','gonzague@orixamedia.com','fabien.guillossou@orixa-group.com','alban@orixamedia.com'];
    if(!EMAILS_AUTORISES.includes(u.email)) { clearToken(); window.location.href='index.html?error=unauthorized'; return; }
    document.getElementById('uName').textContent=u.name||u.email||'';
    if(u.picture) document.getElementById('uAvatar').src=u.picture;
    document.getElementById('loadingTxt').textContent='Chargement historique P&L...';
    histData=await bqQuery(tok,'SELECT entite,annee,ca,mb,ace,fees_direction,production_immobilisee,subventions_exploitation,masse_salariale,impots_taxes,reprises_amst,autres_produits,dotations_amst,dotations_provisions,autres_charges,produits_financiers,charges_financieres,produits_exceptionnels,charges_exceptionnelles,impots_societe,credit_impots,valeur_ajoutee,ebitda,ebit,rcai,resultat_exceptionnel,resultat_net_comptable,resultat_net FROM `db-finances-496809.Historique_BP.Historique_BP_Groupe` ORDER BY annee DESC,entite');
    document.getElementById('loadingOverlay').style.display='none';

    // Pre-selectionner les 4 dernieres annees
    const anneesDispo = [...new Set(histData.map(r=>String(r.annee)))].sort((a,b)=>b-a);
    const top4 = anneesDispo.slice(0,4);
    hA = new Set(top4);
    // Mettre a jour les boutons
    const allBtn = document.querySelector('.h-year[onclick*="all"]');
    if(allBtn) allBtn.classList.remove('active');
    document.querySelectorAll('.h-year').forEach(b => {
      const yr = b.textContent.trim();
      if(top4.includes(yr)) b.classList.add('active');
    });

    renderPL();
  } catch(e) {
    clearToken();
    window.location.href='index.html';
  }
}

init();
</script>
</body>
</html>
