<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Connexion...</title></head>
<body>
<script>
// Cette page capture le token et le passe à la fenêtre parente
var hash = window.location.hash;
if (hash && hash.indexOf('access_token') !== -1) {
  var params = new URLSearchParams(hash.substring(1));
  var token = params.get('access_token');
  if (token && window.opener) {
    window.opener.postMessage({ type: 'oauth_token', token: token }, 'https://michael-orixa.github.io');
    document.body.innerHTML = '<p style="font-family:sans-serif;text-align:center;margin-top:40px;color:#333">Connexion réussie. Fermeture...</p>';
    setTimeout(function() { window.close(); }, 1000);
  }
} else {
  document.body.innerHTML = '<p style="font-family:sans-serif;text-align:center;margin-top:40px;color:#333">Erreur de connexion. Vous pouvez fermer cette fenêtre.</p>';
}
</script>
</body>
</html>
