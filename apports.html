<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apports d’affaire</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Endettement du groupe Orixa : capital restant dû, échéancier de
   décaissement et extinction de la dette, entité par entité.
   Charte reprise à l'identique des pages Activité et Marge brute. */
:root{
  color-scheme: dark;
  --bg:#0f1117;
  --card:#1a1d27;
  --card-2:#222636;
  --line:rgba(255,255,255,.08);
  --line-2:rgba(255,255,255,.14);
  --txt:#e8eaf0;
  --txt-2:#9aa0b4;
  --txt-3:#6b7280;
  --accent:#6366f1;
  --good:#10b981;
  --bad:#ef4444;
  --warn:#eab308;
  /* une teinte par entité juridique. Les deux bleus se distinguent par la
     clarté autant que par la teinte ; la terre cuite d'Orixa tient le
     contraste en niveaux de gris, pour les barres empilées. */
  --e-or:#c66848; --e-om:#7fa6ff; --e-vp:#005fe6;
  --entete:62px;
  --f-ui: "DM Sans", ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:var(--f-ui); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased; display:flex; min-height:100vh;
}

/* ---------- barre latérale ---------- */
.sidebar{width:238px; min-width:238px; background:var(--card); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:fixed; top:0; left:0; height:100vh; z-index:30}
.sidebar-logo{height:var(--entete); flex:0 0 auto; display:flex; align-items:center;
  padding:0 1.2rem; border-bottom:1px solid var(--line)}
.sidebar-nav{display:flex; flex-direction:column; gap:4px; padding:1rem .8rem; flex:1}
.nav-btn{padding:10px 13px; border-radius:8px; border:1px solid transparent; background:transparent;
  color:var(--txt-3); font-size:13px; font-family:inherit; cursor:pointer; font-weight:500;
  text-align:left; width:100%; display:flex; align-items:center; gap:10px;
  text-decoration:none; transition:all .15s}
.nav-btn svg{width:16px; height:16px; flex:0 0 auto; fill:none; stroke:currentColor;
  stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; opacity:.85}
.nav-btn.active svg{opacity:1}
.nav-btn:hover{color:var(--txt); background:var(--card-2)}
.nav-btn.active{border-color:rgba(99,102,241,.3); color:#fff; background:rgba(99,102,241,.15)}
.spacer{flex:1}
.nav-groupe{display:flex; flex-direction:column; gap:4px}
.nav-parent{color:var(--txt-2)}
.nav-parent .chev{margin-left:auto; width:13px; height:13px; opacity:.7; transition:transform .15s}
.nav-parent[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.sous-menu{display:flex; flex-direction:column; gap:2px;
  margin-left:13px; padding-left:11px; border-left:1px solid var(--line-2)}
.nav-btn.sous{font-size:12.5px; padding:8px 11px}
/* sans cette règle, le display:flex ci-dessus l'emporte sur le display:none
   que le navigateur applique à [hidden], et le sous-menu reste ouvert. */
.sous-menu[hidden]{display:none}
.sidebar-footer{padding:1rem .8rem; border-top:1px solid var(--line)}
.user-info{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.user-avatar{width:26px; height:26px; border-radius:50%; background:var(--card-2);
  border:1px solid var(--line); flex-shrink:0}
.user-name{font-size:11px; color:var(--txt-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.btn-logout{padding:5px 10px; border-radius:6px; border:1px solid var(--line); background:transparent;
  color:var(--txt-3); font-size:11px; cursor:pointer; font-family:inherit; width:100%; text-align:center}
.btn-logout:hover{border-color:var(--bad); color:var(--bad)}

.main{margin-left:238px; flex:1; min-width:0}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:rgba(15,17,23,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.top-in{min-height:calc(var(--entete) - 1px); display:flex; align-items:center; gap:14px;
  padding-block:9px;
  padding-left:max(2rem, env(safe-area-inset-left,0px));
  padding-right:max(2rem, env(safe-area-inset-right,0px))}
.top-t{font-size:15px; font-weight:600}
.top-s{font-size:12px; color:var(--txt-3)}
.wrap{padding-block:0 48px;
  padding-left:max(2rem, env(safe-area-inset-left,0px));
  padding-right:max(2rem, env(safe-area-inset-right,0px))}

/* ---------- bandeau de périmètre ---------- */
.perim{display:flex; align-items:flex-start; gap:9px; background:rgba(99,102,241,.07);
  border:1px solid rgba(99,102,241,.22); border-radius:9px; padding:11px 14px;
  font-size:12px; color:var(--txt-2); line-height:1.5}
.perim svg{width:15px; height:15px; flex:0 0 auto; margin-top:1px; fill:none;
  stroke:var(--accent); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.perim b{color:var(--txt); font-weight:600}

/* ---------- rythme vertical ----------
   Repris des pages Activité et Marge brute : 22 px sous la barre de
   titre, 12 px entre deux blocs, 14 px pour une note à l'intérieur d'une
   carte. La règle porte sur tous les enfants de #corps, de sorte qu'un
   bloc ajouté plus tard hérite du bon écart sans qu'on y pense. */
.perim{margin-top:22px}
#corps > *{margin-top:12px}

/* ---------- kpi ----------
   Cinq cartes au lieu de quatre, l'actualisation en dernier : plutôt que
   de figer le nombre de colonnes, on fixe une largeur plancher et on
   laisse la grille retomber d'elle-même. Un indicateur ajouté plus tard
   ne cassera pas la rangée. */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(198px,1fr)); gap:12px}
.kpi{background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:15px 16px; position:relative; overflow:hidden}
.kpi::before{content:""; position:absolute; inset:0 0 auto 0; height:2px; background:var(--accent)}
.kpi.k2::before{background:#f59e0b}
.kpi.k3::before{background:var(--bad)}
.kpi.k4::before{background:var(--e-om)}
.kpi.k5::before{background:var(--good)}

/* ---------- fraîcheur de la donnée ----------
   Repris de la page Activité : même pastille, même pulsation. */
.maj{display:flex; align-items:center; gap:8px; margin-top:7px}
.maj .maj-v{font-size:18px; font-weight:600}
.maj-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;
  position:relative; display:inline-block}
.maj-dot::after{content:""; position:absolute; inset:0; border-radius:50%;
  animation:puls 2.4s ease-out infinite}
.maj-dot.v, .maj-dot.v::after{background:var(--good)}
.maj-dot.o, .maj-dot.o::after{background:#f59e0b}
.maj-dot.r, .maj-dot.r::after{background:var(--bad)}
@keyframes puls{0%{transform:scale(1); opacity:.7} 70%{transform:scale(2.6); opacity:0}
  100%{opacity:0}}
.maj-s{line-height:1.45}
.maj-s b{font-weight:500; color:var(--txt-2)}
.kpi-l{font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--txt-3)}
.kpi-v{font-size:27px; font-weight:600; margin-top:7px; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.kpi-s{font-size:12px; color:var(--txt-2); margin-top:3px}
.kpi-rows{display:flex; flex-direction:column; gap:3px; margin-top:9px}
.kpi-r{display:flex; align-items:baseline; justify-content:space-between; gap:10px; font-size:11.5px}
.kpi-r span{color:var(--txt-3); white-space:nowrap; display:flex; align-items:center; gap:6px}
.kpi-r span i{width:7px; height:7px; border-radius:2px; flex:none; font-style:normal}
.kpi-r b{font-weight:500; font-variant-numeric:tabular-nums; white-space:nowrap}
.kpi-r b.nil{color:var(--txt-3); opacity:.55; font-weight:400}

/* ---------- cartes ---------- */
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.card{background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:17px 18px 19px; min-width:0}
.card.full{grid-column:1/-1}
.ctitle{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--txt-2); margin:0 0 2px}
/* sans sous-titre, le titre collait aux entêtes de colonnes : on rétablit
   l'espacement que le sous-titre assurait, sans le doubler quand il existe */
.ctitle + *{margin-top:16px}
.csub{font-size:11.5px; color:var(--txt-3); margin:0 0 16px}
.ctitle + .csub{margin-top:4px}
.chart-box{position:relative; height:260px}
.chart-box.haut{height:310px}
.note{font-size:11.5px; color:var(--txt-3); margin-top:14px; font-style:italic}
.legend{display:flex; flex-wrap:wrap; gap:7px 14px; margin-top:14px}
.leg{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--txt-2); white-space:nowrap}
.leg i{width:9px; height:9px; border-radius:2px}
.leg i.tr{width:13px; height:0; border-radius:0; border-top:2px dashed rgba(239,68,68,.85)}

/* ---------- panneaux par entité ---------- */
.entites{display:grid; grid-template-columns:repeat(3,1fr); gap:13px}
.ent{background:var(--card-2); border:1px solid var(--line); border-radius:9px;
  padding:14px 15px 15px; min-width:0}
.ent.e-or{border-color:rgba(198,104,72,.34)}
.ent.e-om{border-color:rgba(127,166,255,.30)}
.ent.e-vp{border-color:rgba(0,95,230,.42)}
.ent-n{font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--txt-2);
  display:flex; align-items:center; gap:7px}
.ent-n i{width:8px; height:8px; border-radius:2px; flex:none}
.ent-t{font-size:22px; font-weight:600; font-variant-numeric:tabular-nums;
  letter-spacing:-.01em; margin-top:2px}
.ent-sum{display:flex; flex-wrap:wrap; gap:4px 14px; margin:5px 0 14px;
  font-size:11.5px; color:var(--txt-3)}
.ent-rows{display:flex; flex-direction:column; gap:2px}
.erow{position:relative; display:grid; grid-template-columns:1fr auto; align-items:center;
  gap:9px; padding:5px 8px; border-radius:4px; overflow:hidden}
.erow b{position:absolute; left:0; top:0; bottom:0; background:rgba(255,255,255,.05); border-radius:4px}
.ent.e-or .erow b{background:rgba(198,104,72,.16)}
.ent.e-om .erow b{background:rgba(127,166,255,.14)}
.ent.e-vp .erow b{background:rgba(0,95,230,.24)}
.erow em, .erow span{position:relative}
.erow em{font-style:normal; font-size:12.5px; color:var(--txt-2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.erow em u{text-decoration:none; color:var(--txt-3); font-size:10.5px; margin-left:6px}
.erow span{font-size:12.5px; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.erow.ehead{padding-bottom:3px; margin-bottom:2px; border-bottom:1px solid var(--line)}
.erow.ehead em, .erow.ehead span{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--txt-3); font-weight:500}
.ent-vide{font-size:12px; color:var(--txt-3); font-style:italic; padding:4px 0}

/* ---------- tableaux ----------
   Le conteneur défilant est un garde-fou : même si un libellé de concours
   venait à s'allonger, c'est le tableau qui glisse, jamais la page. */
.tab-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
.tab{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
.tab th{font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--txt-3);
  font-weight:500; text-align:right; padding:0 0 9px 12px; white-space:nowrap}
.tab th:first-child{text-align:left; padding-left:0}
.tab td{padding:8px 0 8px 12px; text-align:right; font-size:12.5px; border-top:1px solid var(--line)}
.tab td:first-child{text-align:left; padding-left:0; color:var(--txt-2)}
.tab tr.encours td{color:var(--txt); font-weight:500}
.tab tr.encours td:first-child{color:var(--txt)}
.tab tr.somme td{border-top:1px solid var(--line-2); font-weight:600; color:var(--txt)}
.tab td.nil{color:var(--txt-3); opacity:.5}
.tab .pt{display:inline-flex; align-items:center; gap:7px}
.tab .pt i{width:7px; height:7px; border-radius:2px; flex:none}
.tab .bulle{display:inline-block; font-size:10px; letter-spacing:.06em; text-transform:uppercase;
  padding:2px 7px; border-radius:4px; border:1px solid rgba(234,179,8,.34);
  background:rgba(234,179,8,.1); color:#facc15}
.tab .mini{display:block; font-size:10.5px; color:var(--txt-3); margin-top:2px}
.tab b.survol{font-weight:inherit; cursor:help; border-bottom:1px dotted var(--line-2)}
.jauge{display:inline-flex; align-items:center; gap:8px; justify-content:flex-end; width:100%}

/* ---------- panneau de survol ----------
   Repris à l'identique de la page Marge brute : même boîte, mêmes lignes,
   même placement. Un seul élément pour toute la page, rempli à la volée. */
.pop{position:fixed; z-index:50; background:var(--card-2); border:1px solid var(--line-2);
  border-radius:8px; padding:11px 13px; box-shadow:0 12px 34px rgba(0,0,0,.5);
  max-width:360px; pointer-events:none}
.pop h4{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--txt-3);
  margin:0 0 7px; font-weight:500}
.pop-row{display:flex; justify-content:space-between; gap:14px; font-size:12px; padding:1.5px 0}
.pop-row em{font-style:normal; color:var(--txt-2); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; display:flex; align-items:center; gap:7px}
.pop-row em i{width:7px; height:7px; border-radius:2px; flex:none}
.pop-row span{font-variant-numeric:tabular-nums; color:var(--txt); white-space:nowrap}
.pop-tot{display:flex; justify-content:space-between; gap:14px; font-size:12px;
  padding:6px 0 0; margin-top:5px; border-top:1px solid var(--line);
  color:var(--txt); font-weight:600}
.pop-tot span{font-variant-numeric:tabular-nums}
.pop-plus{font-size:11px; color:var(--txt-3); font-style:italic; margin-top:6px}
.jauge-b{width:60px; height:5px; background:rgba(255,255,255,.06); border-radius:2px; overflow:hidden; flex:none}
.jauge-b i{display:block; height:100%; border-radius:2px; background:var(--accent)}

/* ---------- chargement et pannes ---------- */
.attente{padding:26px 18px; color:var(--txt-3); font-size:13px; text-align:center}
.panne{background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:16px 18px; margin-top:22px; color:var(--txt-2); font-size:12.5px; line-height:1.5}
.panne b{display:block; color:var(--bad); font-size:13px; margin-bottom:5px}
.panne code{display:block; margin-top:9px; font-family:ui-monospace,Menlo,monospace;
  font-size:11px; color:var(--txt-3); white-space:pre-wrap; word-break:break-word}
.alerte{display:flex; align-items:flex-start; gap:8px; background:rgba(245,158,11,.1);
  border:1px solid rgba(245,158,11,.3); color:#fbbf24; border-radius:7px;
  padding:9px 12px; font-size:11.5px; line-height:1.5; margin-top:12px}
.alerte svg{width:14px; height:14px; flex:0 0 auto; margin-top:2px; fill:none;
  stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}

@media (max-width:1320px){ .grid{grid-template-columns:1fr} }
@media (max-width:1100px){ .entites{grid-template-columns:1fr} }
@media (max-width:900px){
  body{display:block}
  .nav-groupe, .sous-menu{display:contents}
  .chev, .spacer{display:none}
  .sous-menu{margin-left:0; padding-left:0; border-left:0}
  .sidebar{position:static; width:auto; min-width:0; height:auto; flex-direction:row;
    align-items:center; gap:10px; border-right:0; border-bottom:1px solid var(--line); flex-wrap:wrap}
  .sidebar-logo{border-bottom:0; height:auto; padding:.6rem 1rem}
  .sidebar-nav{flex-direction:row; flex-wrap:wrap; padding:.5rem .8rem; gap:6px; flex:1 1 auto}
  .nav-btn{width:auto; padding:7px 11px; font-size:12.5px; gap:7px}
  .sidebar-footer{display:none}
  .main{margin-left:0}
  .kpis{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .kpis{grid-template-columns:1fr}
  /* sur un téléphone on garde ce qui décide : le concours, ce qu'il reste
     à rembourser et la prochaine échéance. Le reste se lit sur grand
     écran, ou en faisant glisser le tableau. */
  .tab th.opt, .tab td.opt, .tab th.opt2, .tab td.opt2{display:none}
  .tab th, .tab td{padding-left:8px; font-size:12px}
  /* les intitulés passent sur deux lignes plutôt que de pousser le
     tableau hors de sa carte */
  .tab th{white-space:normal}
  .tab .mini{font-size:10px}
  .pop{max-width:calc(100vw - 20px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- sélecteur d'exercice, dans la barre de titre ---------- */
.ans{display:flex; gap:4px; margin-left:2px}
.ans .an{padding:5px 11px; border-radius:7px; border:1px solid var(--line);
  background:transparent; color:var(--txt-3); font:inherit; font-size:12px;
  cursor:pointer; font-variant-numeric:tabular-nums; transition:all .15s}
.ans .an:hover{color:var(--txt); border-color:var(--line-2)}
.ans .an.on{background:rgba(99,102,241,.16); border-color:rgba(99,102,241,.4); color:#fff}
.jauge{justify-content:flex-end; white-space:nowrap}

/* ---------- choix de l'apporteur, dans la barre de titre ---------- */
.appo{position:relative; display:inline-flex; align-items:center; margin-left:2px}
.appo-b{display:inline-flex; align-items:center; gap:7px; padding:5px 9px 5px 11px;
  border-radius:7px; border:1px solid var(--line-2); background:transparent;
  color:var(--txt); font:inherit; font-size:12px; cursor:pointer;
  transition:border-color .15s, background .15s}
.appo-b:hover{border-color:var(--txt-3)}
.appo-b.ouvert{border-color:var(--accent); background:rgba(99,102,241,.08)}
.appo-b svg{width:12px; height:12px; flex:none; fill:none; stroke:var(--txt-3);
  stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;
  transition:transform .15s}
.appo-b.ouvert svg{transform:rotate(180deg); stroke:var(--accent)}
.appo-b:focus-visible{outline:2px solid rgba(99,102,241,.55); outline-offset:1px}

/* le panneau : même grammaire que les cartes — fond, bordure, ombre */
.appo-p{position:absolute; top:calc(100% + 6px); left:0; z-index:50;
  min-width:210px; padding:4px; border-radius:10px;
  border:1px solid var(--line-2); background:var(--card);
  box-shadow:0 14px 34px rgba(0,0,0,.45); display:flex;
  flex-direction:column; gap:1px}
/* [hidden] ne l'emporte pas sur display:flex — il faut le dire */
.appo-p[hidden]{display:none}
.appo-o{display:grid; grid-template-columns:1fr auto; align-items:baseline;
  gap:2px 10px; width:100%; padding:7px 9px; border:0; border-radius:7px;
  background:transparent; color:var(--txt); font:inherit; font-size:12px;
  text-align:left; cursor:pointer; transition:background .12s}
.appo-o:hover, .appo-o:focus-visible{background:rgba(255,255,255,.055); outline:none}
.appo-o.on{background:rgba(99,102,241,.12)}
.appo-l{grid-column:1}
.appo-e{grid-column:1; grid-row:2; color:var(--txt-3); font-size:10.5px}
.appo-c{grid-column:2; grid-row:1 / span 2; width:13px; height:13px; fill:none;
  stroke:var(--accent); stroke-width:2.6; stroke-linecap:round;
  stroke-linejoin:round; opacity:0; align-self:center}
.appo-o.on .appo-c{opacity:1}

/* ---------- base de facturation : clients × mois ---------- */
/* 15 colonnes : on resserre la typographie et on fige la colonne client
   pour qu'elle reste lisible pendant le défilement horizontal. */
.fact{font-size:10.5px; min-width:880px}
.fact th, .fact td{padding:4px 6px}
.fact thead th{font-size:9.5px}
.fact .fact-c{font-size:11px}
.fact-c{text-align:left; white-space:nowrap; position:sticky; left:0;
  background:var(--card); z-index:1; padding-right:14px!important}
.fact thead .fact-c{z-index:2}
.fact-m{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums}
.fact-t{text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums;
  font-weight:600; padding-left:14px!important}
.fact th.fact-t{font-weight:500}
/* Trois niveaux de lecture : les montants mensuels s'effacent au profit
   des totaux, et les prévisions s'effacent encore davantage. Si tout
   partageait la teinte des prévisions, la frontière entre facturable et
   projeté disparaîtrait — or c'est elle qui fait la valeur du tableau. */
.fact tbody td.fact-m{color:var(--txt-2)}
.fact .p{color:var(--txt-3)}
.fact tbody td.p{color:var(--txt-3); opacity:.72}
.fact th.p{color:var(--txt-3)}
.fact th.v{opacity:.45}
.fact td.neg{color:var(--warn)!important}

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   Apports d'affaire : commissions dues à un apporteur sur la marge qu'il
   procure à une entité du groupe. L'apporteur se choisit en haut de page ;
   il porte son entité bénéficiaire, dont on lit la marge.

   Deux lectures : la marge brute de cette entité mois par mois, et la marge
   des seuls clients apportés, déjà filtrée par la période de validité de
   chaque accord. Le rapprochement se fait dans le navigateur, ce qui
   permet de changer d'exercice sans repartir en base.

   La rétrocession est calculée client par client, taux par taux, et non
   en appliquant un taux moyen au total : aujourd'hui les 49 accords sont
   à 15 %, mais rien ne garantit que ce sera vrai du prochain.
   ═══════════════════════════════════════════════════════════════════════ */

const P = 'db-finances-496809';

/* ---- jeton Google, partagé avec les autres pages du dashboard ---- */
const TOKEN_TTL = 3500 * 1000;
function loadToken(){
  let tok, ts;
  try { tok = localStorage.getItem('bq_token');
        ts = parseInt(localStorage.getItem('bq_token_ts') || '0'); } catch(e) {}
  return (tok && (Date.now() - ts) < TOKEN_TTL) ? tok : null;
}
function clearToken(){
  try { localStorage.removeItem('bq_token'); localStorage.removeItem('bq_token_ts'); } catch(e) {}
}
function logout(){ clearToken(); window.location.href = 'index.html'; }

async function bqQuery(token, sql){
  const r = await fetch('https://bigquery.googleapis.com/bigquery/v2/projects/'
      + P + '/queries', {
    method:'POST',
    headers:{Authorization:'Bearer ' + token, 'Content-Type':'application/json'},
    body: JSON.stringify({query: sql, useLegacySql:false, timeoutMs:60000, maxResults:5000})
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error('BQ ' + r.status + ' sur ' + table(sql) + ' — '
    + ((d.error && d.error.message) || r.statusText || 'réponse sans motif'));
  if (d.error) throw new Error(table(sql) + ' — ' + d.error.message);
  if (d.jobComplete === false) throw new Error('Requête non terminée dans le délai imparti.');
  if (!d.rows) return [];
  const champs = d.schema.fields.map(f => f.name);
  return d.rows.map(l => { const o = {}; l.f.forEach((c,i) => o[champs[i]] = c.v); return o; });
}
/* nommer la table en cause : trois requêtes partent ensemble */
function table(sql){
  const m = String(sql || '').match(/FROM `[^.]+\.([^`]+)`/);
  return m ? m[1] : 'requête inconnue';
}

/* Clé de rapprochement par le nom : insensible aux accents, à la casse
   et à la ponctuation. Les prévisions sont saisies à la main par les
   account managers ; une comparaison caractère par caractère rejetterait
   « Andès - épiceries » contre « Andes epiceries ». */
const CLE = x => "TRIM(REGEXP_REPLACE(REGEXP_REPLACE(NORMALIZE(LOWER(IFNULL("
  + x + ",'')), NFD), r'\\p{Mn}', ''), r'[^a-z0-9]+', ' '))";

/* Un littéral SQL. En BigQuery l'apostrophe s'échappe par une contre-oblique,
   PAS en la doublant : '' ferme la chaîne et en ouvre une autre, ce qui
   produit une erreur de syntaxe. Ces valeurs viennent d'un classeur que
   quelqu'un édite à la main ; une raison sociale avec apostrophe ne doit
   pas casser la page. */
const sq = v => "'" + String(v == null ? '' : v)
  .replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/[\r\n]+/g, ' ') + "'";

/* Deux circuits de facturation coexistent sous un même accord.
   Soit Orixa Media réalise ET facture le client en direct — un client
   apporté au sens courant. Soit Orixa Media réalise la prestation mais
   c'est l'APPORTEUR qui facture le client : la marge entre alors chez
   Orixa Media sous un compte au nom de l'apporteur, et le chiffre
   d'affaires s'annule côté apporteur, que la commission vient rémunérer.
   Les deux donnent droit à la commission ; seul le circuit diffère.
   La détection reconnaît le nom de l'apporteur, seul ou suivi d'un
   qualificatif (« Visiperf », « Visiperf - mazda »), sans attraper
   « Visiperfection ». */
const RELAIS = lib => '(' + CLE('raison_sociale') + ' = ' + CLE(sq(lib))
  + ' OR STARTS_WITH(' + CLE('raison_sociale') + ', ' + CLE(sq(lib)) + " || ' '))";

/* Le dernier mois réalisé fait la bascule : au-delà, on prend la prévision.
   Le jugement se fait sur le MOIS, pas sur le client — si octobre est clos
   et qu'un client apporté n'a rien facturé, c'est un zéro réel, pas une
   donnée manquante, et aller chercher sa prévision gonflerait la
   rétrocession d'un montant qui n'est pas dû. */
/* Chaque entité bénéficiaire a sa table de marge réalisée et son
   référentiel clients. On ne devine aucun nom : ce qui ne figure pas
   ici n'existe pas pour la page, qui le dira franchement plutôt que
   d'interroger un objet supposé. Ajouter une entité, c'est ajouter
   une ligne ici. */
const ENTITES = {
  'orixa media': { mb:  'MB_Realisee_Orixa_media_mat',
                   ref: 'V_Clients_Orixa_Media_mat' }
};
const ent = e => ENTITES[String(e || '').trim().toLowerCase()] || null;

const CLOS = mb => `clos AS (
  SELECT MAX(mois) AS dernier
  FROM \`${P}.Marge_brute.${mb}\`
  WHERE mois IS NOT NULL)`;

/* La liste des apporteurs alimente le menu déroulant. Chaque apporteur
   porte l'entité dont on lit la marge : c'est ce qui permettra demain
   d'apporter vers une autre entité sans réécrire la page.
   On lit la table matérialisée, jamais la vue : une vue sur classeur
   obligerait chaque lecteur de la page à avoir accès au Drive, et une
   absence d'accès ne se verrait pas — elle déconnecterait. */
const Q_APPORTEURS = `
SELECT code, libelle, entite
FROM \`${P}.Clients.Apporteurs_mat\`
ORDER BY libelle`;

/* La marge brute de l'entité bénéficiaire, tous clients, mois par mois :
   réalisée jusqu'au dernier mois clos, prévue au-delà. Sert de
   dénominateur — sans elle, « 15 % de la marge » ne se situe nulle part. */
const Q_TOTAL = ap => `
WITH ${CLOS(ent(ap.entite).mb)}
SELECT FORMAT_DATE('%Y-%m', mois) AS mois,
       FALSE                      AS prevu,
       ROUND(SUM(mb), 2)          AS mb
FROM \`${P}.Marge_brute.${ent(ap.entite).mb}\`
WHERE mois IS NOT NULL
GROUP BY 1, 2
UNION ALL
SELECT FORMAT_DATE('%Y-%m', p.mois), TRUE, ROUND(SUM(p.mb), 2)
FROM \`${P}.Marge_brute.MB_Previsions_Groupe_mat\` p, clos
WHERE p.entite = ${sq(ap.entite)}
  AND p.mois > clos.dernier
  AND p.mb IS NOT NULL
GROUP BY 1, 2
ORDER BY 1`;

/* La marge des clients apportés, réalisée puis prévue.
   Le filtre de période est fait en base : un mois antérieur au début de
   l'accord ne doit jamais entrer dans le calcul, même par accident de
   jointure.
   Le réalisé se joint sur Id_client — clé sûre. La prévision ne porte
   qu'un nom : on la rattache par la clé normalisée, en imposant un
   appariement strictement 1 pour 1 (une clé par accord, un accord par
   clé). Si deux noms proches se disputent une prévision, on retient la
   plus grosse et on IGNORE l'autre : le calcul peut sous-estimer, jamais
   surestimer — c'est le sens dans lequel on veut se tromper sur une
   facturation intragroupe. */
const Q_APPORTS = ap => `
WITH ${CLOS(ent(ap.entite).mb)},
ref AS (
  SELECT Id_client, Id_groupe
  FROM \`${P}.Clients.${ent(ap.entite).ref}\`
  WHERE Id_groupe IS NOT NULL
),
-- l'accord porte aussi son groupe : c'est la maille du classement, un
-- même groupe pouvant réunir plusieurs comptes clients
app AS (
  SELECT a.id_client, a.raison_sociale, a.taux, a.mois_debut, a.mois_fin,
         r.Id_groupe
  FROM \`${P}.Clients.Apports_affaires_mat\` a
  LEFT JOIN ref r ON r.Id_client = a.id_client
  WHERE a.apporteur = ${sq(ap.code)} AND a.mois_debut IS NOT NULL
),
-- Réalisé des douze derniers mois clos : il sert de clé de répartition.
-- Les marges négatives sont ramenées à zéro — un avoir ne doit pas
-- produire une quote-part négative, qui inverserait l'allocation.
base12 AS (
  SELECT m.Id_client, GREATEST(SUM(m.mb), 0) AS mb
  FROM \`${P}.Marge_brute.${ent(ap.entite).mb}\` m, clos
  WHERE m.mois IS NOT NULL
    AND m.mois >  DATE_SUB(clos.dernier, INTERVAL 12 MONTH)
    AND m.mois <= clos.dernier
  GROUP BY 1
),
-- Dénominateur : TOUS les clients du groupe, apportés ou non. C'est ce
-- qui fait qu'un groupe partiellement apporté ne reçoit que sa part.
grp AS (
  SELECT r.Id_groupe, SUM(IFNULL(b.mb, 0)) AS mb
  FROM ref r LEFT JOIN base12 b ON b.Id_client = r.Id_client
  GROUP BY 1
),
poids AS (
  SELECT a.id_client, a.raison_sociale, a.taux, a.mois_debut, a.mois_fin,
         a.Id_groupe,
         IFNULL(SAFE_DIVIDE(IFNULL(b.mb, 0), NULLIF(g.mb, 0)), 0) AS part
  FROM app a
  JOIN grp g ON g.Id_groupe = a.Id_groupe
  LEFT JOIN base12 b ON b.Id_client = a.id_client
),
src_prev AS (
  SELECT p.Id_groupe, p.client AS libelle, p.mois, p.mb
  FROM \`${P}.Marge_brute.MB_Previsions_Groupe_mat\` p, clos
  WHERE p.entite = ${sq(ap.entite)}
    AND p.mois > clos.dernier
    AND p.mb IS NOT NULL AND p.Id_groupe IS NOT NULL
),
reel AS (
  SELECT m.mois, a.id_client, a.raison_sociale, a.taux, a.mois_debut,
         a.Id_groupe, FALSE AS prevu, CAST(NULL AS STRING) AS rattachement, m.mb
  FROM \`${P}.Marge_brute.${ent(ap.entite).mb}\` m
  JOIN app a ON a.id_client = m.Id_client
  WHERE m.mois IS NOT NULL
    AND m.mois >= a.mois_debut
    AND (a.mois_fin IS NULL OR m.mois <= a.mois_fin)
),
prev AS (
  SELECT p.mois, w.id_client, w.raison_sociale, w.taux, w.mois_debut,
         w.Id_groupe, TRUE AS prevu, p.libelle AS rattachement, p.mb * w.part AS mb
  FROM src_prev p
  JOIN poids w USING (Id_groupe)
  WHERE w.part > 0
    AND p.mois >= w.mois_debut
    AND (w.mois_fin IS NULL OR p.mois <= w.mois_fin)
)
SELECT FORMAT_DATE('%Y-%m', mois)       AS mois,
       id_client, raison_sociale, taux,
       FORMAT_DATE('%Y-%m', mois_debut) AS depuis,
       ${RELAIS(ap.libelle)}            AS relais,
       CAST(Id_groupe AS STRING)        AS id_groupe,
       prevu,
       MAX(rattachement)                AS rattachement,
       ROUND(SUM(mb), 2)                AS mb
FROM (SELECT * FROM reel UNION ALL SELECT * FROM prev)
GROUP BY 1, 2, 3, 4, 5, 6, 7, 8
ORDER BY 1`;

/* Tous les accords, y compris ceux qui n'ont ni réalisé ni prévision.
   Un accord dormant n'est pas une anomalie : c'est un dossier sans
   activité sur la période. La page le dit sans en faire une alerte. */
const Q_ACCORDS = ap => `
SELECT id_client, raison_sociale, taux,
       FORMAT_DATE('%Y-%m', mois_debut) AS depuis,
       FORMAT_DATE('%Y-%m', mois_fin)   AS jusqua,
       ${RELAIS(ap.libelle)}            AS relais
FROM \`${P}.Clients.Apports_affaires_mat\`
WHERE apporteur = ${sq(ap.code)}
ORDER BY raison_sociale`;

/* Fraîcheur : la plus ancienne des deux tables matérialisées dont la page
   dépend, et la date du classeur, dont l'adresse n'est jamais écrite ici. */
const Q_FRAICHEUR = ap => `
SELECT 'table' AS genre, CAST(last_modified_time AS STRING) AS valeur
FROM \`${P}.Clients.__TABLES__\` WHERE table_id = 'Apports_affaires_mat'
UNION ALL
SELECT 'table', CAST(last_modified_time AS STRING)
FROM \`${P}.Marge_brute.__TABLES__\` WHERE table_id = '${ent(ap.entite).mb}'
UNION ALL
SELECT 'classeur', REGEXP_EXTRACT(option_value, r'/d/([A-Za-z0-9_-]+)')
FROM \`${P}.Clients\`.INFORMATION_SCHEMA.TABLE_OPTIONS
WHERE option_name = 'uris' AND table_name IN ('Apports_affaires', 'Apporteurs')`;

/* ═══════════════════════════ OUTILLAGE ═══════════════════════════ */

const echappe = s => String(s == null ? '' : s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const nf = new Intl.NumberFormat('fr-FR');
const MOIS_COURT = ['jan','fév','mar','avr','mai','jun',
                    'jul','aoû','sep','oct','nov','déc'];
const kgros = v => Math.abs(v) >= 1e6 ? (v/1e6).toFixed(1).replace('.',',') + ' M€'
                                      : nf.format(Math.round(v/1000)) + ' K€';
const keur  = v => Math.abs(v) >= 1e6 ? (v/1e6).toFixed(2).replace('.',',') + ' M€'
                                      : nf.format(Math.round(v/1000)) + ' K€';
const eur   = v => nf.format(Math.round(v)) + ' €';
const pct   = (v, b) => b ? (v / b * 100).toFixed(1).replace('.', ',') + ' %' : '—';

const MOIS_C = ['janv.','févr.','mars','avr.','mai','juin',
                'juil.','août','sept.','oct.','nov.','déc.'];
const libMois     = m => MOIS_C[Number(m.slice(5)) - 1] + ' ' + m.slice(2, 4);
const libMoisLong = m => MOIS_C[Number(m.slice(5)) - 1] + ' ' + m.slice(0, 4);

const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* une couleur hexadécimale, rendue translucide — sert à distinguer le
   prévisionnel du réalisé sans changer de teinte */
function alpha(c, a){
  const m = String(c || '').trim().match(/^#?([0-9a-fA-F]{6})$/);
  if (!m) return c;
  const n = parseInt(m[1], 16);
  return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
}

/* ═══════════════════════════ CALCULS ═══════════════════════════ */

const vrai = v => v === true || v === 'true';

function agreger(total, apports, accords){
  const T = {}, EST_PREVU = {};       /* marge Orixa Media par mois */
  total.forEach(l => {
    T[l.mois] = (T[l.mois] || 0) + (Number(l.mb) || 0);
    EST_PREVU[l.mois] = vrai(l.prevu);
  });

  const A = apports.map(l => ({
    mois: l.mois, id: l.id_client, nom: l.raison_sociale,
    taux: Number(l.taux) || 0,
    depuis: l.depuis,
    relais: vrai(l.relais),
    groupe: l.id_groupe || null,
    prevu: vrai(l.prevu),
    rattach: l.rattachement || null,
    mb: Number(l.mb) || 0
  }));

  /* tous les accords, actifs ou dormants */
  const ACC = (accords || []).map(l => ({
    id: l.id_client, nom: l.raison_sociale, taux: Number(l.taux) || 0,
    depuis: l.depuis, jusqua: l.jusqua || null, relais: vrai(l.relais)
  }));

  const annees = [...new Set(Object.keys(T).map(m => m.slice(0, 4)))].sort();

  /* un enregistrement par exercice : marge totale, marge apportée,
     rétrocession, et le détail par client. Les grandeurs suffixées P
     sont la part prévisionnelle, isolable à tout moment. */
  const parAn = {};
  annees.forEach(a => parAn[a] = {total:0, totalP:0, apporte:0, apporteP:0,
                                  retro:0, retroP:0,
                                  clients:{}, mois:{}});
  Object.keys(T).forEach(m => {
    const a = m.slice(0, 4), x = parAn[a];
    if (!x) return;
    x.total += T[m];
    if (EST_PREVU[m]) x.totalP += T[m];
    x.mois[m] = {total: T[m], apporte: 0, retro: 0, prevu: !!EST_PREVU[m]};
  });
  A.forEach(l => {
    const a = l.mois.slice(0, 4), x = parAn[a];
    if (!x) return;
    const r = l.mb * l.taux;
    x.apporte += l.mb; x.retro += r;
    if (l.prevu) { x.apporteP += l.mb; x.retroP += r; }
    const c = x.clients[l.id] || (x.clients[l.id] =
      {nom:l.nom, taux:l.taux, depuis:l.depuis, relais:l.relais, groupe:l.groupe,
       mb:0, mbP:0, retro:0, retroP:0, mois:0, moisP:0, rattach:null});
    c.mb += l.mb; c.retro += r;
    if (l.prevu) { c.mbP += l.mb; c.retroP += r; c.moisP += 1;
                   if (l.rattach) c.rattach = l.rattach; }
    else c.mois += 1;
    const mm = x.mois[l.mois];
    if (mm) { mm.apporte += l.mb; mm.retro += r; }
  });

  return {T, A, ACC, annees, parAn, EST_PREVU};
}

/* L'exercice en cours est incomplet : le comparer à douze mois de N-1
   ferait apparaître une chute là où il n'y a qu'un calendrier. On ne
   retient donc de N-1 que les mois déjà écoulés cette année. */
/* On ne compare que du réalisé à du réalisé : confronter une prévision
   de novembre à un novembre facturé mélangerait deux natures de chiffre. */
function comparable(x, prec){
  if (!prec) return null;
  const mois = new Set(Object.keys(x.mois)
                             .filter(m => !x.mois[m].prevu)
                             .map(m => m.slice(5)));
  const r = {apporte:0, retro:0, total:0, nb: mois.size};
  Object.keys(prec.mois).forEach(m => {
    if (!mois.has(m.slice(5))) return;
    r.apporte += prec.mois[m].apporte;
    r.retro   += prec.mois[m].retro;
    r.total   += prec.mois[m].total;
  });
  return r;
}

/* Top 10 par marge apportée. Le tableau du bas dit la même chose en
   colonnes ; ici la barre rend la CONCENTRATION visible d'un coup d'œil,
   ce qu'une colonne de pourcentages ne fait pas. Un portefeuille où le
   premier client pèse plus que les neuf suivants réunis se voit, il ne
   se calcule pas. */
function vueTop(x){
  /* Classement par GROUPE et non par compte : « Mazda Automobiles France »
     et « Visiperf - mazda » sont le même client commercial, les séparer
     fragmente le palmarès et sous-estime la concentration.
     Faute de table de libellés de groupe, l'étiquette est la raison
     sociale du compte le plus important du groupe ; les comptes sans
     groupe restent seuls sur leur ligne. */
  const par = {};
  Object.entries(x.clients).forEach(([id, c]) => {
    const k = c.groupe || ('seul:' + id);
    const g = par[k] || (par[k] = {id:k, nom:c.nom, mb:0, retro:0, n:0, tete:-Infinity});
    g.mb += c.mb; g.retro += c.retro; g.n += 1;
    if (c.mb > g.tete) { g.tete = c.mb; g.nom = c.nom; }
  });
  const cs = Object.values(par).sort((a, b) => b.mb - a.mb);
  const top = cs.slice(0, 5);
  const max = top.reduce((m, c) => Math.max(m, c.mb), 0) || 1;
  const reste = cs.slice(5);
  const sReste = reste.reduce((t, c) => t + c.mb, 0);

  return '<section class="card">'
    + '<h2 class="ctitle">Top 5 des groupes apportés</h2>'
    + '<div class="palm">'
    + '<div class="palm-th"><span></span><span class="palm-m">'
    + '<b>MB</b><em>Rétrocession</em></span></div>'
    + top.map((c, i) => '<div class="palm-l">'
        + '<span class="palm-r">' + (i + 1) + '</span>'
        + '<div class="palm-c">'
        + '<div class="palm-h"><span class="palm-n">' + echappe(c.nom)
        + (c.n > 1 ? '<span class="palm-g">+' + (c.n - 1) + '</span>' : '') + '</span>'
        + '<span class="palm-m"><b>' + keur(c.mb) + '</b>'
        + '<em>' + keur(c.retro) + '</em></span></div>'
        + '<div class="palm-b"><i style="width:'
        + Math.max(1.5, c.mb / max * 100).toFixed(1) + '%"></i></div>'
        + '</div></div>').join('')
    + '</div>'
    + '</section>';
}

/* Sur les mois prévus, la part apportée s'effondre — non parce que l'apport
   recule, mais parce que peu d'accords portent une prévision. Lu sans
   avertissement, le graphique raconte un décrochage commercial qui n'a pas
   lieu. La page doit donc désamorcer elle-même sa propre lecture. */
function piegeCouverture(x){
  const mois = Object.keys(x.mois);
  const P = mois.filter(m => x.mois[m].prevu), R = mois.filter(m => !x.mois[m].prevu);
  if (!P.length || !R.length) return '';
  const som = (l, c) => l.reduce((s, m) => s + x.mois[m][c], 0);
  const tR = som(R, 'total'), tP = som(P, 'total');
  if (!tR || !tP) return '';
  const pR = som(R, 'apporte') / tR, pP = som(P, 'apporte') / tP;
  if (pP >= pR * 0.75) return '';
  const avec = Object.values(x.clients).filter(c => c.mbP > 0).length;
  const tot  = (D && D.ACC.length) || Object.keys(x.clients).length;
  return '<p class="note" style="margin:14px 0 0">'
    + '<b style="color:var(--txt-2)">À lire avec précaution.</b> La part apportée '
    + 'tombe à ' + (pP * 100).toFixed(1).replace('.', ',') + ' % sur les mois prévus, '
    + 'contre ' + (pR * 100).toFixed(1).replace('.', ',') + ' % sur le réalisé. '
    + 'Ce n’est pas un recul de l’apport : ' + (avec > 1 ? 'seuls ' : 'seul ')
    + '<b style="color:var(--txt-2)">' + avec + ' accord' + (avec > 1 ? 's' : '')
    + ' sur ' + tot + '</b> ' + (avec > 1 ? 'sont rattachés' : 'est rattaché')
    + ' à une prévision. '
    + 'L’écart mesure l’étendue de la saisie prévisionnelle, pas l’activité.</p>';
}

/* Base de facturation : une ligne par client, une colonne par mois.
   Deux partis pris, parce que ce tableau sert à émettre des factures.

   1. Les mois prévisionnels sont grisés et totalisés à part. Facturer une
      prévision serait facturer ce qui n'a pas été produit ; les deux
      natures ne doivent pas se confondre dans une même colonne « total ».

   2. Chaque cellule est arrondie à l'euro, et les totaux somment les
      cellules ARRONDIES, non les valeurs exactes. Le tableau tombe donc
      juste à l'euro près dans les deux sens. Un total calculé sur les
      valeurs exactes afficherait un écart d'un ou deux euros avec la
      somme visible des cellules — inacceptable sur une pièce comptable. */
function vueFacturation(x){
  const an = D.A.filter(l => l.mois.slice(0, 4) === ANNEE);
  if (!an.length) return '';

  const mois = [];
  for (let m = 1; m <= 12; m++) mois.push(ANNEE + '-' + String(m).padStart(2, '0'));
  const estPrevu = m => { const r = x.mois[m]; return r ? !!r.prevu : false; };
  const connu    = m => !!x.mois[m];

  const par = {};
  an.forEach(l => {
    const c = par[l.id] || (par[l.id] = {nom: l.nom, taux: l.taux, m: {}});
    c.m[l.mois] = (c.m[l.mois] || 0) + l.mb * l.taux;
  });
  /* arrondi d'abord, somme ensuite */
  const cs = Object.values(par).map(c => {
    const cel = {}; let du = 0, pr = 0;
    mois.forEach(m => {
      if (c.m[m] === undefined) return;
      const v = Math.round(c.m[m]);
      cel[m] = v;
      if (estPrevu(m)) pr += v; else du += v;
    });
    return {nom: c.nom, taux: c.taux, cel, du, pr};
  }).filter(c => c.du !== 0 || c.pr !== 0)
    .sort((a, b) => (b.du + b.pr) - (a.du + a.pr));

  /* le même total, calculé sans arrondi intermédiaire : l'écart avec la
     somme des cellules est dû aux arrondis, et il faut le dire */
  const exactDu = an.filter(l => !l.prevu)
                    .reduce((t, l) => t + l.mb * l.taux, 0);

  const col = {}, parMois = m => cs.reduce((t, c) => t + (c.cel[m] || 0), 0);
  mois.forEach(m => col[m] = parMois(m));
  const totDu = cs.reduce((t, c) => t + c.du, 0);
  const totPr = cs.reduce((t, c) => t + c.pr, 0);
  const n = v => v === undefined || v === 0 ? '<span class="nil">·</span>'
                                            : nf.format(v);

  return '<section class="card full">'
    + '<h2 class="ctitle">Base de facturation mensuelle · ' + ANNEE
    + ' — Commissions</h2>'
    + '<div class="tab-wrap"><table class="tab fact"><thead><tr>'
    + '<th class="fact-c">Client</th>'
    + mois.map(m => '<th class="fact-m' + (estPrevu(m) ? ' p' : '')
        + (connu(m) ? '' : ' v') + '">' + MOIS_COURT[Number(m.slice(5)) - 1]
        + '</th>').join('')
    + '<th class="fact-t" title="Somme des douze mois, arrondis à l’euro.'
    + ' Les mois grisés sont prévisionnels et ne sont pas facturables.">'
    + 'Total</th>'
    + '</tr></thead><tbody>'
    + cs.map(c => '<tr>'
        + '<td class="fact-c">' + echappe(c.nom) + '</td>'
        + mois.map(m => '<td class="fact-m' + (estPrevu(m) ? ' p' : '')
            + (c.cel[m] < 0 ? ' neg' : '') + '">' + n(c.cel[m]) + '</td>').join('')
        + '<td class="fact-t">'
        + (c.du + c.pr !== 0 ? nf.format(c.du + c.pr) : '—') + '</td>'
        + '</tr>').join('')
    + '<tr class="somme">'
    + '<td class="fact-c">Total</td>'
    + mois.map(m => '<td class="fact-m' + (estPrevu(m) ? ' p' : '')
        + (col[m] < 0 ? ' neg' : '') + '">' + n(col[m]) + '</td>').join('')
    + '<td class="fact-t">' + nf.format(totDu + totPr) + '</td>'
    + '</tr></tbody></table></div>'
    + '</section>';
}

/* ---- survol : le détail mensuel d'un client ---- */
function attacherPop(el, contenu){
  const pop = document.getElementById('pop');
  el.onmouseenter = () => {
    pop.innerHTML = contenu();
    pop.hidden = false;
    const r = el.getBoundingClientRect();
    const h = pop.offsetHeight, w = pop.offsetWidth;
    let left = r.right + 14;
    if (left + w > innerWidth - 10) left = r.left - w - 14;
    pop.style.left = Math.max(10, left) + 'px';
    pop.style.top  = Math.max(10, Math.min(r.top + r.height / 2 - h / 2,
                                           innerHeight - h - 10)) + 'px';
  };
  el.onmouseleave = () => { pop.hidden = true; };
}
function popClient(id){

               .sort((a, b) => a.mois.localeCompare(b.mois));
  const tot = l.reduce((s, x) => s + x.mb, 0);
  const prev = l.filter(x => x.prevu);
  return '<h4>' + echappe(l.length ? l[0].nom : '') + ' · ' + ANNEE + '</h4>'
    + l.map(x => '<div class="pop-row' + (x.prevu ? ' p' : '') + '"><em>'
        + libMois(x.mois) + (x.prevu ? ' <span class="pop-f">prév.</span>' : '')
        + '</em><span>' + eur(x.mb) + '</span></div>').join('')
    + '<div class="pop-tot"><em>Marge</em><span>' + eur(tot) + '</span></div>'
    + '<div class="pop-row" style="padding-top:5px"><em>Rétrocession</em><span>'
    + eur(l.reduce((s, x) => s + x.mb * x.taux, 0)) + '</span></div>'
    + (prev.length
        ? '<div class="pop-note">dont ' + eur(prev.reduce((s, x) => s + x.mb, 0))
          + ' de prévision sur ' + prev.length + ' mois, rattachée par le nom'
          + (prev[0].rattach ? ' « ' + echappe(prev[0].rattach) + ' »' : '') + '</div>'
        : '');
}

/* ---- graphique ---- */
function tracerMois(x){
  const cv = document.getElementById('gMois');
  if (!cv) return;
  if (typeof Chart === 'undefined'){
    cv.parentElement.innerHTML = '<p class="note" style="margin:0">Graphique '
      + 'indisponible : la librairie n’a pas pu être chargée.</p>';
    return;
  }
  const mois = Object.keys(x.mois).sort();
  const p = mois.map(m => !!x.mois[m].prevu);
  const acc = cssv('--accent');
  /* Les mois prévus sont peints en plus clair et bordés : on doit voir
     au premier coup d'œil où s'arrête le facturé. */
  if (graphe) graphe.destroy();
  graphe = new Chart(cv, {
    type:'bar',
    data:{ labels: mois.map(libMois), datasets:[
      {label:'Apportée', data: mois.map(m => Math.round(x.mois[m].apporte)),
       backgroundColor: p.map(v => v ? alpha(acc, .34) : acc),
       borderColor:    p.map(v => v ? alpha(acc, .85) : 'transparent'),
       borderWidth:    p.map(v => v ? 1 : 0),
       borderRadius:{topLeft:2, topRight:2}, categoryPercentage:.8, barPercentage:.95},
      {label:'Reste', data: mois.map(m =>
         Math.round(Math.max(0, x.mois[m].total - x.mois[m].apporte))),
       backgroundColor: p.map(v => v ? 'rgba(255,255,255,.055)'
                                     : 'rgba(255,255,255,.14)'),
       borderColor:    p.map(v => v ? 'rgba(255,255,255,.3)' : 'transparent'),
       borderWidth:    p.map(v => v ? 1 : 0),
       borderRadius:{topLeft:2, topRight:2}, categoryPercentage:.8, barPercentage:.95}
    ]},
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index', intersect:false},
      plugins:{ legend:{display:false},
        tooltip:{backgroundColor:'#171a24', borderColor:'rgba(255,255,255,.12)',
          borderWidth:1, titleColor:'#e8eaf0', bodyColor:'#9aa0b4', padding:10,
          callbacks:{
            title: it => !it.length ? '' : libMoisLong(mois[it[0].dataIndex])
                         + (p[it[0].dataIndex] ? '   ·   prévision' : ''),
            label: c => ' ' + c.dataset.label + ' · ' + eur(c.parsed.y),
            footer: it => { const t = it.reduce((s, i) => s + i.parsed.y, 0);
              const a = it.find(i => i.dataset.label === 'Apportée');
              return 'Total · ' + eur(t)
                   + (a && t ? '   (' + (a.parsed.y / t * 100).toFixed(1).replace('.', ',')
                       + ' % apportée)' : ''); } } } },
      scales:{
        x:{stacked:true, grid:{display:false}, border:{color:'rgba(255,255,255,.1)'},
           ticks:{color:'#6b7186', font:{size:10}, maxRotation:0, autoSkip:true,
                  maxTicksLimit:12}},
        y:{stacked:true, grid:{color:'rgba(255,255,255,.05)'}, border:{display:false},
           ticks:{color:'#6b7186', font:{size:11},
                  callback:v => nf.format(v/1000) + ' K'}}
      }
    }
  });
}

/* ---- fraîcheur ---- */
const SEUIL_VERT = 5 * 60, SEUIL_ORANGE = 12 * 60;   /* minutes */
const SEUIL_CLASSEUR = 180;                          /* jours */
function depuisLe(ms){
  const m = Math.floor((Date.now() - ms) / 60000);
  if (m < 60)   return 'il y a ' + m + ' min';
  if (m < 2880) return 'il y a ' + Math.round(m / 60) + ' h';
  const j = Math.round(m / 1440);
  return j < 60 ? 'il y a ' + j + ' j' : 'il y a ' + Math.round(j / 30) + ' mois';
}
function poserFraicheur(etat, texte, detail){
  const v = document.querySelector('.maj .maj-v');
  const d = document.querySelector('.maj .maj-dot');
  const s = document.querySelector('.maj-s');
  if (!v) return;
  v.textContent = texte;
  v.style.color = etat === 'r' ? 'var(--bad)' : 'var(--txt)';
  d.className = 'maj-dot ' + etat;
  s.innerHTML = detail;
}
async function actualisation(tok, ap){
  try {
    const l = await bqQuery(tok, Q_FRAICHEUR(ap));
    const ts = l.filter(x => x.genre === 'table').map(x => Number(x.valeur))
                .filter(x => x > 0);
    const ids = l.filter(x => x.genre === 'classeur').map(x => x.valeur).filter(Boolean);
    if (!ts.length) throw new Error('aucun horodatage de table');
    const vieux = Math.min(...ts);                 /* la plus ancienne des deux */
    const min = Math.round((Date.now() - vieux) / 60000);
    const etat = min <= SEUIL_VERT ? 'v' : min <= SEUIL_ORANGE ? 'o' : 'r';
    const dt = new Date(vieux);
    let sup = '';
    const vus = [];
    await Promise.all(ids.map(async id => {
      try {
        const r = await fetch('https://www.googleapis.com/drive/v3/files/' + id
          + '?fields=modifiedTime', {headers:{Authorization:'Bearer ' + tok}});
        if (!r.ok) return;
        const j = await r.json();
        if (j.modifiedTime) vus.push(Date.parse(j.modifiedTime));
      } catch(e){ /* classeur injoignable : la ligne est omise */ }
    }));
    if (vus.length){
      const vc = Math.min(...vus);
      const jours = Math.floor((Date.now() - vc) / 86400000);
      sup = '<br><span style="color:' + (jours > SEUIL_CLASSEUR ? '#fbbf24' : 'var(--txt-3)')
          + '">classeur des apports modifié ' + depuisLe(vc) + '</span>';
    }
    poserFraicheur(etat, depuisLe(vieux),
      '<span style="color:var(--txt-3)">'
      + dt.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'})
      + ' à ' + dt.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})
      + '</span>' + sup);
  } catch(e){
    poserFraicheur('o', 'inconnue',
      '<span style="color:var(--txt-3)">La date du dernier rafraîchissement n’a pas '
      + 'pu être obtenue. Les montants affichés, eux, proviennent bien des tables.</span>');
  }
}

/* ═══════════════════════════ RENDU ═══════════════════════════ */

/* Le choix de l'apporteur repart en base : ce n'est pas un filtre
   d'affichage, c'est un autre périmètre, une autre entité bénéficiaire
   et potentiellement d'autres tables. */
function selecteurApporteurs(){
  const el = document.getElementById('appo');
  if (!el) return;
  /* Un <select> natif s'ouvre avec le rendu du système : ni la teinte,
     ni les bordures, ni l'état sélectionné ne sont atteignables par la
     feuille de style. On construit donc le panneau nous-mêmes. */
  el.innerHTML =
    '<button type="button" class="appo-b" id="appoB" aria-haspopup="listbox" '
    + 'aria-expanded="false"><span>' + echappe(APPO.libelle) + '</span>'
    + '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'
    + '</button>'
    + '<div class="appo-p" id="appoP" role="listbox" hidden>'
    + APPOS.map(a => '<button type="button" role="option" class="appo-o'
        + (a.code === APPO.code ? ' on' : '') + '" data-code="' + echappe(a.code) + '"'
        + ' aria-selected="' + (a.code === APPO.code) + '">'
        + '<span class="appo-l">' + echappe(a.libelle) + '</span>'
        + '<span class="appo-e">' + echappe(a.entite) + '</span>'
        + '<svg viewBox="0 0 24 24" aria-hidden="true" class="appo-c">'
        + '<path d="M20 6L9 17l-5-5"/></svg></button>').join('')
    + '</div>';

  const b = el.querySelector('#appoB'), p = el.querySelector('#appoP');
  const ouvrir = v => { p.hidden = !v; b.setAttribute('aria-expanded', String(v));
                        b.classList.toggle('ouvert', v);
                        if (v) (p.querySelector('.appo-o.on') || p.firstChild).focus(); };

  b.onclick = e => { e.stopPropagation(); ouvrir(p.hidden); };
  p.querySelectorAll('.appo-o').forEach(o => o.onclick = e => {
    e.stopPropagation();
    ouvrir(false);
    const a = APPOS.find(x => x.code === o.dataset.code);
    if (a && a.code !== APPO.code) charger(a);
  });
  /* fermer au clic ailleurs et à Échap : sans cela le panneau reste
     ouvert derrière le reste de la page */
  document.addEventListener('click', ev => {
    if (!p.hidden && !el.contains(ev.target)) ouvrir(false);
  });
  el.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && !p.hidden) { ouvrir(false); b.focus(); }
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){
      const l = [...p.querySelectorAll('.appo-o')];
      const i = l.indexOf(document.activeElement);
      if (i >= 0){ ev.preventDefault();
        l[(i + (ev.key === 'ArrowDown' ? 1 : l.length - 1)) % l.length].focus(); }
    }
  });
}

function selecteurAnnees(){
  const el = document.getElementById('ans');
  /* Même borne que le tableau de tendance : les exercices antérieurs
     restent chargés, mais ne sont plus proposés. L'exercice affiché est
     toujours offert, pour ne jamais laisser le sélecteur sans sa valeur. */
  el.innerHTML = D.annees
    .filter(a => a >= PREMIER_EXERCICE || a === ANNEE)
    .reverse().map(a =>
    '<button type="button" class="an' + (a === ANNEE ? ' on' : '') + '" data-an="' + a
    + '">' + a + '</button>').join('');
  el.querySelectorAll('button').forEach(b =>
    b.onclick = () => { ANNEE = b.dataset.an; rendre(); });
}

function rendre(){
  const x = D.parAn[ANNEE];
  const prec = D.parAn[String(Number(ANNEE) - 1)];
  document.getElementById('corps').innerHTML =
      vueKpis(x, prec)
    + '<div class="grid">' + vuePoids(D) + vueTop(x) + '</div>'
    + vueFacturation(x)
    + vueClients(x);

  selecteurApporteurs();
  selecteurAnnees();
  tracerMois(x);
  document.querySelectorAll('.tab b.survol[data-cli]').forEach(b =>
    attacherPop(b, () => popClient(b.dataset.cli)));

  /* La barre de titre reste muette quand tout va bien : les chiffres sont
     dans les pavés, juste en dessous. Elle n'est utilisée que pour dire
     qu'une lecture a échoué. */
  document.getElementById('topS').textContent = '';
}

/* Charge — ou recharge — la page pour un apporteur donné. Changer
   d'apporteur n'est pas un filtre d'affichage : le périmètre, l'entité
   bénéficiaire et les tables interrogées changent, donc on repart en base. */
async function charger(a){
  const e = ent(a.entite);
  if (!e){
    document.getElementById('topS').textContent = 'entité inconnue';
    document.getElementById('corps').innerHTML =
      '<div class="panne"><b>Entité bénéficiaire non reconnue</b>'
      + 'L’apporteur <b>' + echappe(a.libelle) + '</b> est rattaché à l’entité '
      + '« ' + echappe(a.entite) + ' », pour laquelle cette page ne connaît aucune '
      + 'table de marge réalisée. Plutôt que d’interroger un objet supposé, elle '
      + 's’arrête ici. Corrigez l’entité dans le classeur Apporteurs, ou signalez-la '
      + 'pour qu’elle soit déclarée.</div>';
    APPO = a; selecteurApporteurs();
    return;
  }
  APPO = a;
  document.getElementById('corps').innerHTML =
    '<div class="attente">Lecture des apports de ' + echappe(a.libelle) + '…</div>';

  const [total, apports, accords] = await Promise.all([
    bqQuery(TOK, Q_TOTAL(a)), bqQuery(TOK, Q_APPORTS(a)), bqQuery(TOK, Q_ACCORDS(a))
  ]);
  if (!total.length){
    document.getElementById('topS').textContent = 'aucune donnée';
    document.getElementById('corps').innerHTML =
      '<div class="panne"><b>Aucune marge à rapprocher</b>'
      + 'La table ' + echappe(e.mb) + ' n’a renvoyé aucune ligne. Elle est '
      + 'reconstruite par la requête planifiée MAJ_tables : c’est de ce côté qu’il '
      + 'faut regarder.</div>';
    selecteurApporteurs();
    return;
  }
  if (!accords.length && !apports.length){
    document.getElementById('topS').textContent = 'aucun accord';
    document.getElementById('corps').innerHTML =
      '<div class="panne"><b>Aucun accord d’apport pour ' + echappe(a.libelle) + '</b>'
      + 'Cet apporteur est déclaré dans le classeur Apporteurs, mais aucune ligne du '
      + 'classeur des apports ne lui est rattachée. Il n’y a donc rien à rétrocéder — '
      + 'ce n’est pas une erreur de lecture.</div>';
    selecteurApporteurs();
    actualisation(TOK, a);
    return;
  }
  D = agreger(total, apports, accords);
  /* On ouvre sur l'exercice en cours — celui du dernier mois facturé —
     et non sur le dernier exercice connu, qui n'est que de la prévision. */
  const clos = Object.keys(D.EST_PREVU).filter(m => !D.EST_PREVU[m]).sort().pop();
  ANNEE = (clos && D.parAn[clos.slice(0, 4)]) ? clos.slice(0, 4)
                                              : D.annees[D.annees.length - 1];
  rendre();
  actualisation(TOK, a);
}

async function init(){
  const tok = loadToken();
  if (!tok){ window.location.href = 'index.html'; return; }
  try {
    const u = await fetch('https://www.googleapis.com/oauth2/v3/userinfo',
      {headers:{Authorization:'Bearer ' + tok}}).then(r => r.json());
    if (u.error) throw new Error(u.error.message);
    document.getElementById('uName').textContent = u.name || u.email || '';
    if (u.picture) document.getElementById('uAvatar').src = u.picture;
    if (!await controlerAcces(tok)) return;

    APPOS = (await bqQuery(tok, Q_APPORTEURS)).map(a => ({
      code: a.code, libelle: a.libelle, entite: a.entite
    }));
    if (!APPOS.length) throw new Error('aucun apporteur actif dans V_Apporteurs');
    TOK = tok;
    await charger(APPOS[0]);
  } catch(e){
    const msg = String((e && e.message) || e);
    if (/401|UNAUTHENTICATED|invalid[_ ]token|Invalid Credentials/i.test(msg)){
      clearToken(); window.location.href = 'index.html';
    } else {
      document.getElementById('topS').textContent = 'chargement interrompu';
      document.getElementById('corps').innerHTML =
        '<div class="panne"><b>Chargement interrompu</b>'
        + 'Votre session reste ouverte. Rechargez la page pour réessayer.'
        + '<code>' + echappe(msg) + '</code></div>';
    }
  }
}

init();
</script>
